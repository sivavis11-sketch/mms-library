<!DOCTYPE html>

<head>

<title>MMS Library</title>
<meta name="theme-color" content="#ECE8E1">
<meta name="description" content="Library attendance and reading assessment tracking for Mathakondapalli Model School.">
<link rel="manifest" href="./manifest.json">
<link rel="icon" href="./icons/icon-192.png">
<link rel="apple-touch-icon" href="./icons/icon-180.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="MMS Library">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

</head>
<body>

<div id="cover" hidden>
  <span class="cover-date" id="coverDate"></span>
  <div class="cover-book">
    <span class="cover-school">MATHAKONDAPALLI<br>MODEL SCHOOL</span>
    <div>
      <div class="cover-title">MMS<br>Library</div>
      <div class="cover-orn" aria-hidden="true"><i></i><b></b><i></i></div>
      <div class="cover-tag">A reader today.<br>A leader tomorrow.</div>
    </div>
    <span class="cover-foot">LIBRARY JOURNAL</span>
  </div>
  <button class="btn soft" id="openBook">Open the book <span class="knob"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12h14M13 6l6 6-6 6"/></svg></span></button>
</div>

<div id="app"><main id="main">
  <div id="content"><div class="loading"><div class="spinner"></div>Loading…</div></div>
</main></div>

<nav id="tabbar">
  <button class="tab" data-route="dashboard"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 11l9-8 9 8M5 10v10h14V10"/></svg>Home</button>
  <button class="tab" data-route="timetable"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="4" width="18" height="17" rx="3"/><path d="M3 9h18M8 2v4M16 2v4"/></svg>Timetable</button>
  <button class="tab" data-route="students"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="9" cy="8" r="3"/><path d="M2.5 20c0-3.6 2.9-6 6.5-6s6.5 2.4 6.5 6M16 9a3 3 0 1 1 0 6M16 15c3 .4 5 2.2 5.5 5"/></svg>Students</button>
  <button class="tab" data-route="attendance"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 12l2 2 4-4"/><rect x="3" y="4" width="18" height="17" rx="3"/></svg>Attendance</button>
  <button class="tab" data-route="reports"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 19V9M12 19V5M20 19v-7M3 19h18"/></svg>Reports</button>
</nav>

<div id="toast" role="status" aria-live="polite"></div>

<script src="./config.js?v=20261002-1"></script>
<script src="./app.js?v=20261002-2"></script>
</body>
</html>
